# Docker Compose para Dokploy
# Sem MySQL/Redis internos — esses serviços são gerenciados externamente pelo Dokploy
# Variáveis de ambiente idênticas ao docker-compose.yml para compatibilidade
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:latest
    restart: unless-stopped
    ports:
      - "${GETFY_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-local}
      APP_DEBUG: ${GETFY_APP_DEBUG:-true}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-true}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-mysql}
      DB_HOST: ${GETFY_DB_HOST:-mysql}
      DB_PORT: ${GETFY_DB_PORT:-3306}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${GETFY_REDIS_PASSWORD:-null}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "true"

  queue:
    image: getfy_app:latest
    restart: unless-stopped
    command:
      - "sh"
      - "-lc"
      - |
        set -e
        php artisan queue:work --sleep=3 --tries=3 --timeout=0 --memory=${GETFY_QUEUE_WORKER_MEMORY:-128} --max-time=${GETFY_QUEUE_WORKER_MAX_TIME:-3600} --max-jobs=${GETFY_QUEUE_WORKER_MAX_JOBS:-1000} & Q=$$!
        php artisan schedule:work & S=$$!
        trap 'kill $$Q $$S 2>/dev/null || true' INT TERM
        while kill -0 $$Q 2>/dev/null && kill -0 $$S 2>/dev/null; do sleep 5; done
        exit 1
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-local}
      APP_DEBUG: ${GETFY_APP_DEBUG:-true}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-mysql}
      DB_HOST: ${GETFY_DB_HOST:-mysql}
      DB_PORT: ${GETFY_DB_PORT:-3306}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${GETFY_REDIS_PASSWORD:-null}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
    depends_on:
      app:
        condition: service_healthy

volumes:
  getfy_storage:
    driver: local
  getfy_env:
    driver: local
