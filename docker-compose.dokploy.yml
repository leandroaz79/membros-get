# Docker Compose para Dokploy
# Use este arquivo quando o Dokploy gerencia MySQL e Redis externamente
# ou quando voce quer um deploy simplificado sem services internos
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:latest
    restart: unless-stopped
    ports:
      - "${GETFY_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      APP_INSTALLED: ${APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${APP_AUTO_MIGRATE:-true}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-getfy}
      DB_USERNAME: ${DB_USERNAME:-getfy}
      DB_PASSWORD: ${DB_PASSWORD:-getfy}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "true"

  queue:
    image: getfy_app:latest
    restart: unless-stopped
    command:
      - "sh"
      - "-lc"
      - |
        set -e
        php artisan queue:work --sleep=3 --tries=3 --timeout=0 --memory=${GETFY_QUEUE_WORKER_MEMORY:-128} --max-time=${GETFY_QUEUE_WORKER_MAX_TIME:-3600} --max-jobs=${GETFY_QUEUE_WORKER_MAX_JOBS:-1000} & Q=$$!
        php artisan schedule:work & S=$$!
        trap 'kill $$Q $$S 2>/dev/null || true' INT TERM
        while kill -0 $$Q 2>/dev/null && kill -0 $$S 2>/dev/null; do sleep 5; done
        exit 1
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      APP_INSTALLED: ${APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-getfy}
      DB_USERNAME: ${DB_USERNAME:-getfy}
      DB_PASSWORD: ${DB_PASSWORD:-getfy}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
    depends_on:
      app:
        condition: service_healthy

volumes:
  getfy_storage:
    driver: local
  getfy_env:
    driver: local
